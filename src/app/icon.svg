<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Neural core favicon: icosahedron silhouette in brand colors -->
  <rect width="32" height="32" fill="#050505" rx="6"/>
  <!-- Outer hexagon approximation (icosahedron outline) -->
  <polygon
    points="16,3 27,9.5 27,22.5 16,29 5,22.5 5,9.5"
    fill="none"
    stroke="#22c55e"
    stroke-width="1.2"
    opacity="0.85"
  />
  <!-- Inner diamond (inner shell) -->
  <polygon
    points="16,8 22,13 22,21 16,24 10,21 10,13"
    fill="none"
    stroke="#ef4444"
    stroke-width="1"
    opacity="0.7"
  />
  <!-- White core dot -->
  <circle cx="16" cy="16" r="2.5" fill="#ffffff"/>
  <!-- Diagonal lines (wireframe edges) -->
  <line x1="5" y1="9.5"  x2="16" y2="16" stroke="#22c55e" stroke-width="0.6" opacity="0.4"/>
  <line x1="27" y1="9.5" x2="16" y2="16" stroke="#22c55e" stroke-width="0.6" opacity="0.4"/>
  <line x1="16" y1="3"   x2="16" y2="16" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
  <line x1="5" y1="22.5" x2="16" y2="16" stroke="#22c55e" stroke-width="0.6" opacity="0.4"/>
  <line x1="27" y1="22.5" x2="16" y2="16" stroke="#22c55e" stroke-width="0.6" opacity="0.4"/>
  <line x1="16" y1="29"  x2="16" y2="16" stroke="#ef4444" stroke-width="0.6" opacity="0.4"/>
</svg>