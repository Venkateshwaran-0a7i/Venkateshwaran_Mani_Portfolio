# Example nginx config for serving the static `out/` folder produced by
# `npm run build:static`. Drop this into /etc/nginx/sites-available/portfolio
# (or include it from your main config) and point `root` at the exported build.
#
# Critical for video scrubbing: `Accept-Ranges` + no buffering so browsers can
# issue HTTP Range requests against portfolio-background.mp4.

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /var/www/portfolio/out;
    index index.html;

    # Gzip text assets (do NOT gzip already-compressed video)
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff2;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options SAMEORIGIN always;

    # Long-cache hashed Next assets
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Video — enable range requests (required for scrubbing)
    location /video/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Accept-Ranges bytes;
        # Disable proxy buffering if behind another proxy
        # proxy_buffering off;
        try_files $uri =404;
    }

    # Trailing-slash static export pages (e.g. /about/ → about/index.html)
    location / {
        try_files $uri $uri/ $uri.html /404.html;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
