[build]
  command = "npm run build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
  DEPLOY_TARGET = "static"

[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Accept-Ranges = "bytes"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# SPA-style fallback is NOT needed for a fully static export with trailingSlash.
# Keep 404.html generated by Next for unknown paths.
